<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本日電視台直播 - LTMPS Campus TV</title>
  <style>
    /* ==========================================
       全域與極光幻彩背景 (Aurora Holographic Theme)
       ========================================== */
    * { box-sizing: border-box; }
    
    body {
      margin: 0; padding: 0;
      background-color: #030305;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", sans-serif;
      overflow-x: hidden;
    }

    .aurora-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
    .aurora-orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.45; animation: orbit 20s linear infinite; }
    .orb-1 { width: 50vw; height: 50vw; background: #4facfe; top: -10%; left: -10%; }
    .orb-2 { width: 60vw; height: 60vw; background: #ff0844; bottom: -20%; right: -10%; animation-direction: reverse; animation-duration: 25s; }
    .orb-3 { width: 45vw; height: 45vw; background: #9b23ea; top: 30%; left: 30%; animation-duration: 30s; opacity: 0.35;}
    
    @keyframes orbit { 
      0% { transform: rotate(0deg) translateX(50px) rotate(0deg); } 
      100% { transform: rotate(360deg) translateX(50px) rotate(-360deg); } 
    }

    /* 主內容區塊 (配合無導航列，上方間距調大) */
    .main-content { max-width: 1150px; margin: 0 auto; padding: 60px 24px 80px; }

    /* ==========================================
       動態漸層標題與雲端編輯特效
       ========================================== */
    .page-header { text-align: center; margin-bottom: 35px; display: flex; flex-direction: column; align-items: center; }
    .title-wrapper { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }

    .page-title {
      font-size: 46px; font-weight: 900; margin: 0;
      background: linear-gradient(270deg, #ff8a00, #e52e71, #9d00ff, #00f2fe, #4facfe);
      background-size: 400% 400%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: gradient-text 8s ease infinite; letter-spacing: 1px; padding: 4px 16px; border-radius: 12px;
      transition: all 0.3s ease; outline: none; min-width: 250px; text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    @keyframes gradient-text { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .page-title.editing { background: rgba(0, 0, 0, 0.6); -webkit-text-fill-color: #fff; box-shadow: 0 0 0 2px #00f2fe, 0 0 20px rgba(0, 242, 254, 0.5); animation: none; text-shadow: none; }

    .edit-btn {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff; border-radius: 50%; width: 44px; height: 44px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .edit-btn:hover { background: #00f2fe; border-color: #00f2fe; transform: scale(1.15) rotate(8deg); box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); }
    .edit-btn.small { width: 34px; height: 34px; font-size: 14px; }
    
    .edit-btn.success { background: #38ef7d; border-color: #38ef7d; box-shadow: 0 0 20px rgba(56, 239, 125, 0.8); transform: scale(1.1); }

    .page-subtitle { font-size: 16px; color: #b5b5c3; margin: 0; font-weight: 500; letter-spacing: 0.5px; }
    .date-highlight { color: #00f2fe; font-weight: 700; text-shadow: 0 0 8px rgba(0, 242, 254, 0.4); }

    /* ==========================================
       臨時宣佈橫幅
       ========================================== */
    .announcement-wrapper {
      display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 8px 16px 8px 20px;
      background: linear-gradient(90deg, rgba(255, 36, 66, 0.15) 0%, rgba(255, 36, 66, 0.05) 100%);
      border-left: 4px solid #ff2442; border-radius: 8px; backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(255, 36, 66, 0.15); transition: all 0.3s ease; max-width: 90%;
    }
    .announcement-wrapper.editing { background: rgba(0, 0, 0, 0.7); border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }

    .announcement-label { font-weight: 800; color: #ff3355; letter-spacing: 0.5px; text-shadow: 0 0 10px rgba(255, 36, 66, 0.4); white-space: nowrap; }
    .announcement-text { color: #fff; font-size: 15px; font-weight: 500; outline: none; min-width: 200px; padding: 4px 8px; border-radius: 6px; transition: background 0.2s; word-break: break-word; text-align: left; }
    .announcement-text.editing { background: rgba(255, 255, 255, 0.1); color: #fff; }

    @media (max-width: 768px) { .announcement-wrapper { flex-direction: column; align-items: center; text-align: center; border-left: none; border-top: 4px solid #ff2442; } }

    /* ==========================================
       播放器與 UI 介面
       ========================================== */
    .live-player-container { width: 100%; background-color: #050505; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 255, 255, 0.05); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
    .live-player-container.is-live { border-color: rgba(255, 36, 66, 0.6); box-shadow: 0 0 50px rgba(255, 36, 66, 0.4), 0 25px 60px rgba(0, 0, 0, 0.8); }
    .live-player-container.fake-fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; max-width: 100vw !important; max-height: 100vh !important; z-index: 2147483647 !important; border-radius: 0 !important; border: none !important; display: flex !important; flex-direction: column !important; background: #000 !important; }
    .live-player-container.fake-fullscreen .video-wrapper { flex: 1 1 auto !important; aspect-ratio: auto !important; height: 100% !important; }
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: #000; }
    .video-wrapper iframe, .video-wrapper #player-slot { width: 100%; height: 100%; display: block; border: 0; }

    .live-custom-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 16px 22px; background: rgba(15, 15, 20, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 14px; color: #fff; }
    .bar-left, .bar-right { display: flex; align-items: center; gap: 14px; }
    .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; }
    .dot.waiting { background: linear-gradient(45deg, #f6d365, #fda085); animation: pulse-colorful 2s infinite; }
    .dot.live { background: #ff2442; box-shadow: 0 0 16px #ff2442, 0 0 32px #ff2442; animation: pulse-live 1s infinite alternate; }

    @keyframes pulse-colorful { 0%, 100% { transform: scale(0.9); filter: hue-rotate(0deg); box-shadow: 0 0 10px rgba(253,160,133, 0.6); } 50% { transform: scale(1.15); filter: hue-rotate(90deg); box-shadow: 0 0 20px rgba(246,211,101, 0.8); } }
    @keyframes pulse-live { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.3); opacity: 1; } }

    .status-title { font-weight: 800; letter-spacing: 1px; }
    .status-hint { color: #a1a1b5; font-size: 12px; }

    .btn { color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 9px 18px; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); }
    #auto-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border-color: #38ef7d; }
    #auto-btn.active-refresh { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); border-color: #ff4b2b; }
    .btn-reload { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-color: #764ba2; }
    .btn-fs { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); border-color: #635694; }
    .btn:hover { transform: translateY(-4px); filter: brightness(1.2); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); border-color: #fff; }
    .btn:active { transform: translateY(0); }

    .btn-link { background: linear-gradient(to right, #f6d365 0%, #fda085 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; font-size: 14px; font-weight: 800; padding: 6px 8px; transition: all 0.3s ease; }
    .btn-link:hover { filter: brightness(1.3) drop-shadow(0 0 12px rgba(253, 160, 133, 0.6)); }
  </style>
</head>
<body>

  <!-- 背景特效 -->
  <div class="aurora-bg">
    <div class="aurora-orb orb-1"></div><div class="aurora-orb orb-2"></div><div class="aurora-orb orb-3"></div>
  </div>

  <main class="main-content">
    
    <!-- 標題與宣佈區塊 -->
    <div class="page-header">
      <div class="title-wrapper">
        <h1 class="page-title" id="page-title" contenteditable="false" spellcheck="false">連線中...</h1>
        <button class="edit-btn" id="edit-title-btn" onclick="toggleEditTitle()" title="修改標題並同步">✏️</button>
      </div>
      <p class="page-subtitle" id="page-subtitle">今天是 <span class="date-highlight" id="today-date">載入中...</span>，歡迎收看 LTMPS 校園電視台直播，請耐心等候節目開始。</p>
      
      <div class="announcement-wrapper" id="ann-wrapper">
        <span class="announcement-label">🚨 臨時宣佈：</span>
        <span class="announcement-text" id="page-announcement" contenteditable="false" spellcheck="false">連線中...</span>
        <button class="edit-btn small" id="edit-ann-btn" onclick="toggleEditAnnouncement()" title="修改臨時宣佈">✏️</button>
      </div>
    </div>

    <!-- 播放器區塊 -->
    <div class="live-player-container" id="player-container">
      <div class="video-wrapper" id="video-wrapper">
        <div id="player-slot"></div>
      </div>

      <div class="live-custom-bar">
        <div class="bar-left">
          <span id="live-dot" class="dot waiting"></span>
          <span id="live-text" class="status-title">讀取排程表...</span>
          <span id="auto-refresh-status" class="status-hint"></span>
        </div>
        <div class="bar-right">
          <button type="button" class="btn btn-fs" id="fs-btn" onclick="toggleFullScreen()" title="全螢幕切換">⛶ 全螢幕</button>
          <button type="button" class="btn" id="auto-btn" onclick="toggleAutoRefresh()" title="開啟每 5 秒自動重整">⏱ 開始自動刷新</button>
          <button type="button" class="btn btn-reload" onclick="manualReload()" title="手動立即刷新檢查">🔄 立即重試</button>
          <a id="yt-external-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-link">YouTube 觀看 ➔</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // ==========================================
    // 自動日期顯示
    // ==========================================
    function updateTodayDate() {
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('today-date').innerText = new Date().toLocaleDateString('zh-TW', options);
    }
    updateTodayDate();

    // ==========================================
    // Firebase 即時標題與宣佈同步系統
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBr0-oNmRN859g6bfGDVjSdA1brJC8CxNs",
      authDomain: "ltmps-c92a0.firebaseapp.com",
      projectId: "ltmps-c92a0",
      storageBucket: "ltmps-c92a0.firebasestorage.app",
      messagingSenderId: "716255242034",
      appId: "1:716255242034:web:b25a037869d8a9de6f992b"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const titleEl = document.getElementById('page-title');
    const editTitleBtn = document.getElementById('edit-title-btn');
    const annEl = document.getElementById('page-announcement');
    const annWrapper = document.getElementById('ann-wrapper');
    const editAnnBtn = document.getElementById('edit-ann-btn');

    // 監聽雲端資料
    db.collection("settings").doc("live").onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        if (data.title && titleEl.contentEditable !== "true") titleEl.innerText = data.title;
        if (data.announcement !== undefined && annEl.contentEditable !== "true") annEl.innerText = data.announcement || "目前無特別宣佈事項";
      } else {
        if(titleEl.contentEditable !== "true") titleEl.innerText = "本日電視台直播";
        if(annEl.contentEditable !== "true") annEl.innerText = "目前無特別宣佈事項";
      }
    });

    function showSuccessAnim(btnElement) {
      btnElement.innerText = "✅"; btnElement.classList.add("success");
      setTimeout(() => { btnElement.innerText = "✏️"; btnElement.classList.remove("success"); }, 1500);
    }

    function toggleEditTitle() {
      if (titleEl.contentEditable === "true") {
        titleEl.contentEditable = "false"; titleEl.classList.remove('editing'); editTitleBtn.innerText = "⏳";
        const newTitle = titleEl.innerText.trim() || "本日電視台直播";
        db.collection("settings").doc("live").set({ title: newTitle }, { merge: true })
          .then(() => showSuccessAnim(editTitleBtn))
          .catch(err => { alert("❌ 儲存失敗！\n請確定 Firebase Firestore 權限已開放。"); editTitleBtn.innerText = "✏️"; });
      } else {
        titleEl.contentEditable = "true"; titleEl.classList.add('editing'); titleEl.focus(); editTitleBtn.innerText = "💾";
      }
    }

    function toggleEditAnnouncement() {
      if (annEl.contentEditable === "true") {
        annEl.contentEditable = "false"; annEl.classList.remove('editing'); annWrapper.classList.remove('editing'); editAnnBtn.innerText = "⏳";
        const newAnn = annEl.innerText.trim();
        db.collection("settings").doc("live").set({ announcement: newAnn }, { merge: true })
          .then(() => showSuccessAnim(editAnnBtn))
          .catch(err => { alert("❌ 儲存失敗！\n請確定 Firebase Firestore 權限已開放。"); editAnnBtn.innerText = "✏️"; });
      } else {
        annEl.contentEditable = "true"; annEl.classList.add('editing'); annWrapper.classList.add('editing'); annEl.focus(); editAnnBtn.innerText = "💾";
      }
    }

    titleEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); toggleEditTitle(); } });
    annEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); toggleEditAnnouncement(); } });


    // ==========================================
    // 試算表排程系統 (退回舊版純字串分割，保證 100% 成功)
    // ⚠️ 請確保試算表 A 欄日期格式為 YYYY/MM/DD (如: 2026/9/20)
    // ==========================================
    const SHEET_ID = '11PFRIwREa_PJBNog3kLyraoRrd6PRvgBqA8-ATmv5Pk'; 
    let VIDEO_ID = 'Cx3yJraVcnA'; // 預設備用

    let player = null, refreshTimer = null, countdown = 5;
    let isLiveStarted = false, isAutoRefreshEnabled = false, isApiReady = false, isDataLoaded = false;

    function extractVideoId(input) {
      if (!input) return null;
      const match = input.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/))([\w-]{11})/);
      return (match && match[1]) ? match[1] : (input.trim().length === 11 ? input.trim() : null);
    }

    const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    
    fetch(sheetUrl)
      .then(response => response.text())
      .then(data => {
        if (data) {
          const lines = data.split(/\r?\n/);
          const today = new Date();
          const tYear = today.getFullYear();
          const tMonth = today.getMonth() + 1;
          const tDate = today.getDate();

          let foundTodayId = null;
          let latestPastId = null; 
          let firstAvailableId = null; 

          for (let i = 0; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length >= 2) {
              const dateStr = cols[0].replace(/['"]/g, '').trim(); 
              const urlStr = cols[1].replace(/['"]/g, '').trim();  
              
              const rowDate = new Date(dateStr);
              if (!isNaN(rowDate.getTime())) {
                const rYear = rowDate.getFullYear();
                const rMonth = rowDate.getMonth() + 1;
                const rDate = rowDate.getDate();

                const extId = extractVideoId(urlStr);
                
                if (extId) {
                   if (!firstAvailableId) firstAvailableId = extId; // 記錄表內第一支影片
                   if (rYear === tYear && rMonth === tMonth && rDate === tDate) {
                     foundTodayId = extId;
                     break; 
                   }
                   if (rowDate <= today) {
                     latestPastId = extId; 
                   }
                }
              }
            }
          }
          
          if (foundTodayId) {
            VIDEO_ID = foundTodayId;
          } else if (latestPastId) {
            VIDEO_ID = latestPastId;
          } else if (firstAvailableId) {
            VIDEO_ID = firstAvailableId;
          }
        }
        finishDataLoad();
      })
      .catch(err => {
        finishDataLoad();
      });

    function finishDataLoad() {
      isDataLoaded = true;
      document.getElementById('yt-external-link').href = `https://www.youtube.com/watch?v=${VIDEO_ID}`;
      document.getElementById('live-text').innerText = '準備就緒，等待開播';
      updateStatusText();
      initPlayer();
    }

    function onYouTubeIframeAPIReady() {
      isApiReady = true;
      initPlayer();
    }

    function initPlayer() {
      if (!isApiReady || !isDataLoaded) return;

      if (player && typeof player.destroy === 'function') {
        try { player.destroy(); } catch(e) {}
        player = null;
      }

      const wrapper = document.getElementById('video-wrapper');
      wrapper.innerHTML = '<div id="player-slot"></div>';

      player = new YT.Player('player-slot', {
        videoId: VIDEO_ID,
        playerVars: {
          'autoplay': 1,
          'mute': 1,
          'rel': 0,
          'playsinline': 1,
          'fs': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      const iframe = player.getIframe();
      if (iframe) {
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen');
      }
      
      event.target.mute();
      event.target.playVideo();
      
      if (isAutoRefreshEnabled && !isLiveStarted) {
        startCountdown();
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING) {
        if (player && typeof player.getCurrentTime === 'function' && player.getCurrentTime() > 0) {
          handleLiveStarted();
        } else if (event.data === YT.PlayerState.PLAYING) {
          handleLiveStarted();
        }
      }
    }

    function handleLiveStarted() {
      if (isLiveStarted) return;
      isLiveStarted = true;
      
      stopCountdown();
      
      const container = document.getElementById('player-container');
      if (container) container.classList.add('is-live');

      document.getElementById('live-dot').className = 'dot live';
      document.getElementById('live-text').innerText = '🔴 直播進行中';
      document.getElementById('auto-refresh-status').innerText = '（已連線，請點擊畫面取消靜音）';
      
      const autoBtn = document.getElementById('auto-btn');
      if (autoBtn) autoBtn.style.display = 'none';
    }

    function toggleAutoRefresh() {
      if (isLiveStarted) return;
      
      isAutoRefreshEnabled = !isAutoRefreshEnabled;
      const btn = document.getElementById('auto-btn');
      
      if (isAutoRefreshEnabled) {
        btn.innerText = '⏹ 停止自動刷新';
        btn.classList.add('active-refresh');
        startCountdown();
      } else {
        btn.innerText = '⏱️ 開始自動刷新';
        btn.classList.remove('active-refresh');
        stopCountdown();
      }
    }

    function startCountdown() {
      if (isLiveStarted) return;
      countdown = 5;
      updateStatusText();

      if (!refreshTimer) {
        refreshTimer = setInterval(() => {
          countdown--;
          updateStatusText();
          if (countdown <= 0) {
            countdown = 5;
            if (!isLiveStarted) {
              rebuildLiveConnection();
            }
          }
        }, 1000);
      }
    }
    
    function rebuildLiveConnection() {
      if (isLiveStarted) return;
      initPlayer();
    }

    function stopCountdown() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
      updateStatusText();
    }

    function updateStatusText() {
      const statusElem = document.getElementById('auto-refresh-status');
      if (statusElem && !isLiveStarted) {
        if (isAutoRefreshEnabled) {
          statusElem.innerText = `（將在 ${countdown}s 後刷新檢查）`;
        } else {
          statusElem.innerText = `（自動刷新已關閉）`;
        }
      }
    }

    function manualReload() {
      if (isLiveStarted) return;
      countdown = 5;
      updateStatusText();
      rebuildLiveConnection();
    }

    // ==========================================
    // 核心全螢幕 + 滿版備援機制
    // ==========================================
    function toggleFullScreen() {
      const fsBtn = document.getElementById('fs-btn');
      const container = document.getElementById('player-container');
      const wrapper = document.getElementById('video-wrapper');
      const iframe = player && player.getIframe ? player.getIframe() : null;

      if (container.classList.contains('fake-fullscreen')) {
        container.classList.remove('fake-fullscreen');
        if (fsBtn) fsBtn.innerText = '⛶ 全螢幕';
        return;
      }

      const isFullscreen = document.fullscreenElement ||
                           document.webkitFullscreenElement ||
                           document.mozFullScreenElement ||
                           document.msFullscreenElement;

      if (isFullscreen) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      } else {
        let target = iframe || wrapper;
        let req = target.requestFullscreen ||
                  target.webkitRequestFullscreen ||
                  target.mozRequestFullScreen ||
                  target.msRequestFullscreen;

        if (req) {
          try {
            let p = req.call(target);
            if (p && p.catch) {
              p.catch(err => {
                enterFakeFullscreen();
              });
            }
          } catch(e) {
            enterFakeFullscreen();
          }
        } else {
          enterFakeFullscreen();
        }
      }
    }

    function enterFakeFullscreen() {
      const container = document.getElementById('player-container');
      const fsBtn = document.getElementById('fs-btn');
      container.classList.add('fake-fullscreen');
      if (fsBtn) fsBtn.innerText = '🗗 縮小';
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, () => {
        const fsBtn = document.getElementById('fs-btn');
        const isFullscreen = document.fullscreenElement ||
                             document.webkitFullscreenElement ||
                             document.mozFullScreenElement ||
                             document.msFullscreenElement;
        if (fsBtn) {
          fsBtn.innerText = isFullscreen ? '🗗 縮小' : '⛶ 全螢幕';
        }
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const container = document.getElementById('player-container');
        const fsBtn = document.getElementById('fs-btn');
        if (container.classList.contains('fake-fullscreen')) {
          container.classList.remove('fake-fullscreen');
          if (fsBtn) fsBtn.innerText = '⛶ 全螢幕';
        }
      }
    });
  </script>
</body>
</html>
